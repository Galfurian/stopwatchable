<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stopwatch</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <section class="controls" aria-label="Stopwatch">
            <h3 id="display" aria-live="polite">00:00.00</h3>

            <div class="dropdown-container" role="group" aria-label="Stopwatch controls">
                <button id="startStopBtn" type="button">Start</button>
                <button id="lapBtn" type="button" disabled>Lap</button>
                <button id="resetBtn" type="button">Reset</button>
            </div>

            <hr>

            <h3>Laps</h3>
            <ol id="lapsList" aria-live="polite"></ol>
        </section>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
